<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Iluminando Caminos | Psicología integral en Veracruz</title>
  <meta name="description" content="Iluminando Caminos Psicología Integral: terapia individual, de pareja, familiar y grupal en Veracruz y en línea con Rosa Laura Torres Díaz, psicóloga y psicoterapeuta.">
  <meta name="theme-color" content="#7b4bb3">
  <meta name="robots" content="index, follow">
  <link rel="icon" href="<%= BASE_URL %>assets/logo.ico">

  <!-- Open Graph / redes sociales -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_MX">
  <meta property="og:site_name" content="Iluminando Caminos Psicología Integral">
  <meta property="og:title" content="Iluminando Caminos | Psicología integral en Veracruz">
  <meta property="og:description" content="Terapia individual, de pareja, familiar y grupal en Veracruz y en línea. Agenda tu cita al +52 229 209 2415.">
  <meta name="twitter:card" content="summary_large_image">
  <% if (process.env.VUE_APP_SITE_URL) { %>
  <link rel="canonical" href="<%= process.env.VUE_APP_SITE_URL %>/">
  <meta property="og:url" content="<%= process.env.VUE_APP_SITE_URL %>/">
  <meta property="og:image" content="<%= process.env.VUE_APP_SITE_URL %>/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Terapia para adolescentes, adultos, de pareja, familiar y grupal en Iluminando Caminos">
  <% } %>

  <!-- Conexiones anticipadas a orígenes de terceros -->
  <link rel="preconnect" href="https://cdn.lordicon.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.youtube.com">

  <!-- Datos estructurados para buscadores (negocio local) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MedicalBusiness",
    "name": "Iluminando Caminos Psicología Integral",
    "description": "Clínica de psicología en Veracruz: terapia individual, de pareja, familiar y grupal, grupos de crecimiento, meditación y relajación, presencial y en línea.",
    "telephone": "+52 229 209 2415",
    "email": "psic.ilucam@gmail.com",
    "foundingDate": "2013",
    "founder": {
      "@type": "Person",
      "name": "Rosa Laura Torres Díaz",
      "jobTitle": "Psicóloga y psicoterapeuta"
    },
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Josefa Salum 605, Fracc. Villa Rica",
      "addressLocality": "Veracruz",
      "addressRegion": "Veracruz",
      "postalCode": "91800",
      "addressCountry": "MX"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": 19.2201,
      "longitude": -96.1832
    },
    "areaServed": "MX",
    "sameAs": [
      "https://www.facebook.com/iluminandocaminospsicintegral",
      "https://www.youtube.com/channel/UCf4fJKz9FQqNxRj0chpTVaw"
    ]<% if (process.env.VUE_APP_SITE_URL) { %>,
    "url": "<%= process.env.VUE_APP_SITE_URL %>/",
    "image": "<%= process.env.VUE_APP_SITE_URL %>/og-image.jpg"<% } %>
  }
  </script>
</head>
<body>
  <noscript>
    <strong>Iluminando Caminos necesita JavaScript para funcionar correctamente. Por favor, actívalo para continuar.</strong>
  </noscript>
  <div id="app"></div>
</body>
</html>
